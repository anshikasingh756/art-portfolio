<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Sketchbook</title>

  <!-- Authentic Handwritten Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="header-left">
      <button class="app-icon-btn" title="Library">📁</button>
      <div class="book-meta">
        <h1 class="book-name">Illustrations</h1>
        <span class="page-indicator" id="page-counter">Page 1 of 3</span>
      </div>
    </div>
    <div class="header-right">
      <button class="app-icon-btn" title="Share">📤</button>
      <button class="app-icon-btn" title="Grid View">🗂️</button>
    </div>
  </header>

  <!-- Interactive Sketchbook Spread -->
  <main class="sketchbook-workspace">
    <div class="book" id="sketchbook">
      
      <!-- Page 1 -->
      <div class="page" data-page="1">
        <div class="page-content">
          <div class="art-card tilt-left" data-title="Crown Frog & Friends" data-desc="Characters & Little Doodles">
            <div class="washi-tape tape-pink"></div>
            <img src="https://via.placeholder.com/400x450/ffe6ea/333333?text=Frog+Concept" alt="Art 1">
            <p class="sketch-caption">"I don't care!!"</p>
          </div>
          <div class="art-card tilt-right" data-title="Summer Popsicle" data-desc="Sticker Sheet Concept">
            <div class="washi-tape tape-yellow"></div>
            <img src="https://via.placeholder.com/400x420/fff4cc/333333?text=Popsicle" alt="Art 2">
            <p class="sketch-caption">"Stay sweet ✨"</p>
          </div>
        </div>
      </div>

      <!-- Page 2 -->
      <div class="page" data-page="2">
        <div class="page-content">
          <div class="art-card tilt-right-small" data-title="Green Boy & Leaf" data-desc="Soft Color Illustration">
            <div class="washi-tape tape-blue"></div>
            <img src="https://via.placeholder.com/400x450/e6f0ff/333333?text=Green+Boy" alt="Art 3">
            <p class="sketch-caption">"Do what makes you happy"</p>
          </div>
          <div class="art-card tilt-left-small" data-title="Forest Critters" data-desc="Sketchbook Study">
            <div class="washi-tape tape-pink"></div>
            <img src="https://via.placeholder.com/400x430/ffe6ea/333333?text=Critters" alt="Art 4">
            <p class="sketch-caption">"Keep growing 🌱"</p>
          </div>
        </div>
      </div>

      <!-- Page 3 -->
      <div class="page" data-page="3">
        <div class="page-content">
          <div class="art-card tilt-left" data-title="Friendly Dragon" data-desc="Creature Design">
            <div class="washi-tape tape-yellow"></div>
            <img src="https://via.placeholder.com/400x450/fff4cc/333333?text=Dragon" alt="Art 5">
            <p class="sketch-caption">"Mythical friends"</p>
          </div>
          <div class="art-card tilt-right" data-title="About the Artist" data-desc="Digital Scrapbook Journal">
            <div class="note-paper">
              <h3 class="handwritten-title">Hello there! 👋</h3>
              <p class="note-text">Welcome to my digital sketchbook app. Click any drawing to view it up close, and use the bottom dock to flip pages!</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Bottom Floating App Dock -->
  <nav class="app-dock">
    <button class="dock-btn" id="prev-btn" title="Previous Page">⬅️ Prev</button>
    <div class="dock-divider"></div>
    <button class="dock-btn" id="next-btn" title="Next Page">Next ➡️</button>
  </nav>

  <!-- Lightbox Modal Viewer -->
  <div id="lightbox" class="lightbox">
    <span class="close-lightbox">&times;</span>
    <img id="lightbox-img" src="" alt="Enlarged view">
    <div class="lightbox-info">
      <h2 id="lightbox-title"></h2>
      <p id="lightbox-desc"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
