<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Sketchbook App</title>

  <!-- Clean Minimalist Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn" id="shelf-btn" title="Back to Library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="book-info">
        <h1 id="book-title">Digital Art 2026</h1>
        <span id="page-indicator">Page 1 of 4</span>
      </div>
    </div>
    
    <div class="header-right">
      <button class="icon-btn" id="fullscreen-btn" title="Toggle Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- LIBRARY SHELF VIEW (Select a Sketchbook) -->
  <section id="library-view" class="library-view hidden">
    <h2 class="library-heading">Your Sketchbooks</h2>
    <div class="shelf-grid">
      
      <!-- Book 1 Cover -->
      <div class="book-cover-item" data-book="0">
        <div class="cover-preview cover-blue">
          <span class="cover-tag">2026</span>
          <h3 class="cover-title">Digital Art 2026</h3>
        </div>
        <p class="cover-meta">4 Spreads • Illustrations</p>
      </div>

      <!-- Book 2 Cover -->
      <div class="book-cover-item" data-book="1">
        <div class="cover-preview cover-warm">
          <span class="cover-tag">STUDIES</span>
          <h3 class="cover-title">Fabric & Traditional</h3>
        </div>
        <p class="cover-meta">2 Spreads • Paintings</p>
      </div>

      <!-- Book 3 Cover -->
      <div class="book-cover-item" data-book="2">
        <div class="cover-preview cover-dark">
          <span class="cover-tag">CONCEPTS</span>
          <h3 class="cover-title">Graphic Design</h3>
        </div>
        <p class="cover-meta">2 Spreads • Visuals</p>
      </div>

    </div>
  </section>

  <!-- 3D SKETCHBOOK VIEWER -->
  <main id="viewer-view" class="viewer-view">
    <div class="book-stage">
      <div class="book-3d" id="book-3d">
        <!-- 3D Page leaves will be dynamically built or rendered here -->
      </div>
    </div>
  </main>

  <!-- Bottom Floating Navigation Dock -->
  <nav class="app-dock">
    <button class="dock-btn" id="prev-btn" title="Previous Page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="dock-divider"></div>
    <button class="dock-btn" id="next-btn" title="Next Page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

  <!-- Fullscreen Artwork Modal -->
  <div id="image-modal" class="modal-overlay">
    <span class="close-modal">&times;</span>
    <img id="modal-img" src="" alt="Enlarged Artwork">
  </div>

  <script src="script.js"></script>
</body>
</html>
