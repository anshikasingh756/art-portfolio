<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchbook</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #12141c; /* Midnight blue background */
      color: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Top Minimalist Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      background: transparent;
      z-index: 100;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .icon-btn.hidden {
      display: none;
    }

    /* VIEW 1: Carousel Shelf */
    .shelf-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1500px;
    }

    .shelf-view.hidden {
      display: none;
    }

    .shelf-container {
      display: flex;
      gap: 3rem;
      align-items: center;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Blank Minimalist Covers */
    .sketchbook-cover {
      width: 240px;
      height: 340px;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      border-left: 10px solid rgba(0, 0, 0, 0.3); /* Spine shadow */
      transition: transform 0.4s ease, filter 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sketchbook-cover:hover {
      transform: translateY(-10px) scale(1.03);
      filter: brightness(1.15);
    }

    .cover-dark { background: #1a1c23; }
    .cover-warm { background: #25201e; }
    .cover-blue { background: #192231; }

    /* Pagination Dots */
    .shelf-dots {
      display: flex;
      gap: 0.6rem;
      margin-top: 2rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .dot.active {
      background: #ffffff;
    }

    /* VIEW 2: A5 Open Notebook Spread Viewer */
    .viewer-view {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 2500px;
    }

    .viewer-view.hidden {
      display: none;
    }

    /* A5 Open Book Proportions (Width: ~840px, Height: ~580px) */
    .book-stage {
      width: 840px;
      height: 570px;
      position: relative;
      transform-style: preserve-3d;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      background: #dfded9;
      border-radius: 4px;
    }

    .book-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    /* 3D Double-Page Spread Leaf */
    .page-leaf {
      position: absolute;
      width: 100%;
      height: 100%;
      right: 0;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    .page-leaf.flipped {
      transform: rotateY(-180deg);
    }

    .page-side {
      position: absolute;
      width: 50%;
      height: 100%;
      backface-visibility: hidden;
      background-color: #faf9f6; /* Clean drawing paper white */
      top: 0;
      overflow: hidden;
    }

    .page-side.left {
      left: 0;
      border-right: 1px solid #e0dfdc;
      box-shadow: inset -12px 0 20px rgba(0,0,0,0.03); /* Center binding shadow */
    }

    .page-side.right {
      right: 0;
      box-shadow: inset 12px 0 20px rgba(0,0,0,0.03); /* Center binding shadow */
    }

    .page-side.back-left {
      left: 0;
      transform: rotateY(180deg);
      border-right: 1px solid #e0dfdc;
    }

    .page-side.back-right {
      right: 0;
      transform: rotateY(180deg);
    }

    /* Full-Page Drawing Slots */
    .page-slot {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .page-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Bottom Navigation Dock */
    .app-dock {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding: 1.2rem;
      background: transparent;
      z-index: 100;
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    /* Fullscreen Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 10, 15, 0.96);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay img {
      max-width: 92%;
      max-height: 92%;
      object-fit: contain;
    }

    .close-modal {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 36px;
      color: #a0aec0;
      cursor: pointer;
    }

    .close-modal:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <button class="icon-btn hidden" id="back-btn" title="Back to Shelf">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </header>

  <!-- VIEW 1: Shelf Carousel -->
  <section id="shelf-view" class="shelf-view">
    <div class="shelf-container" id="shelf-carousel">
      <div class="sketchbook-cover cover-dark" data-book="0"></div>
      <div class="sketchbook-cover cover-warm" data-book="1"></div>
      <div class="sketchbook-cover cover-blue" data-book="2"></div>
    </div>
    
    <div class="shelf-dots" id="shelf-dots">
      <div class="dot active" data-index="0"></div>
      <div class="dot" data-index="1"></div>
      <div class="dot" data-index="2"></div>
    </div>
  </section>

  <!-- VIEW 2: Open Notebook Viewer -->
  <main id="viewer-view" class="viewer-view hidden">
    <div class="book-stage">
      <div class="book-3d" id="book-3d">
        
        <!-- 
          ⭐ ADD ANY AMOUNT OF PAGES YOU WANT HERE! ⭐
          Every 2 pages form a complete open notebook spread (Left page & Right page).
        -->
        <div class="page"><img src="https://via.placeholder.com/600x850/ffffff/12141c?text=Page+1" alt="Page 1"></div>
        <div class="page"><img src="https://via.placeholder.com/600x850/f7f6f2/12141c?text=Page+2" alt="Page 2"></div>
        <div class="page"><img src="https://via.placeholder.com/600x850/ffffff/12141c?text=Page+3" alt="Page 3"></div>
        <div class="page"><img src="https://via.placeholder.com/600x850/f7f6f2/12141c?text=Page+4" alt="Page 4"></div>
        <!-- To add more pages, simply add: -->
        <!-- <div class="page"><img src="your-image.jpg" alt="Page"></div> -->

      </div>
    </div>
  </main>

  <!-- Bottom Navigation Dock -->
  <nav class="app-dock hidden" id="viewer-dock">
    <button class="dock-btn" id="prev-btn" title="Previous Page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="dock-btn" id="next-btn" title="Next Page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

  <!-- Fullscreen Modal -->
  <div id="image-modal" class="modal-overlay">
    <span class="close-modal">&times;</span>
    <img id="modal-img" src="" alt="Enlarged Art">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      let currentLeafIdx = 0;
      let totalLeaves = 0;

      const shelfView = document.getElementById('shelf-view');
      const viewerView = document.getElementById('viewer-view');
      const viewerDock = document.getElementById('viewer-dock');
      const backBtn = document.getElementById('back-btn');
      const book3d = document.getElementById('book-3d');
      const nextBtn = document.getElementById('next-btn');
      const prevBtn = document.getElementById('prev-btn');
      const shelfCarousel = document.getElementById('shelf-carousel');
      const dots = document.querySelectorAll('.dot');

      // Open Sketchbook
      document.querySelectorAll('.sketchbook-cover').forEach(card => {
        card.addEventListener('click', () => {
          buildNotebookSpreads();
          shelfView.classList.add('hidden');
          viewerView.classList.remove('hidden');
          viewerDock.classList.remove('hidden');
          backBtn.classList.remove('hidden');
        });
      });

      // Build 3D Notebook Spreads from HTML elements
      function buildNotebookSpreads() {
        const rawPages = Array.from(book3d.querySelectorAll('.page'));
        book3d.innerHTML = '';

        // Each leaf consists of 2 pages (Left & Right when open)
        totalLeaves = Math.ceil(rawPages.length / 2);

        for (let i = 0; i < totalLeaves; i++) {
          const leaf = document.createElement('div');
          leaf.className = 'page-leaf';
          leaf.style.zIndex = totalLeaves - i;

          const leftContent = rawPages[i * 2] ? rawPages[i * 2].innerHTML : '';
          const rightContent = rawPages[i * 2 + 1] ? rawPages[i * 2 + 1].innerHTML : '';

          leaf.innerHTML = `
            <div class="page-side left">
              ${leftContent ? `<div class="page-slot">${leftContent}</div>` : ''}
            </div>
            <div class="page-side right">
              ${rightContent ? `<div class="page-slot">${rightContent}</div>` : ''}
            </div>
            <div class="page-side back-left"></div>
            <div class="page-side back-right">
              <!-- Back sides of turning pages can hold subsequent left pages if needed, structured for notebook flow -->
            </div>
          `;

          book3d.appendChild(leaf);
        }

        // Refined multi-leaf sequential layout for notebook turning
        rebuildSpreadDom(rawPages);
      }

      function rebuildSpreadDom(rawPages) {
        book3d.innerHTML = '';
        totalLeaves = Math.ceil(rawPages.length / 2);

        for (let i = 0; i < totalLeaves; i++) {
          const leaf = document.createElement('div');
          leaf.className = 'page-leaf';
          leaf.style.zIndex = totalLeaves - i;

          const frontLeft = rawPages[i * 2] ? rawPages[i * 2].innerHTML : '';
          const frontRight = rawPages[i * 2 + 1] ? rawPages[i * 2 + 1].innerHTML : '';
          const backLeft = rawPages[(i + 1) * 2] ? rawPages[(i + 1) * 2].innerHTML : '';
          const backRight = rawPages[(i + 1) * 2 + 1] ? rawPages[(i + 1) * 2 + 1].innerHTML : '';

          leaf.innerHTML = `
            <div class="page-side left"><div class="page-slot">${frontLeft}</div></div>
            <div class="page-side right"><div class="page-slot">${frontRight}</div></div>
            <div class="page-side back-left"><div class="page-slot">${backLeft}</div></div>
            <div class="page-side back-right"><div class="page-slot">${backRight}</div></div>
          `;

          book3d.appendChild(leaf);
        }

        currentLeafIdx = 0;
        updatePageFlips();
        bindModals();
      }

      function updatePageFlips() {
        const leaves = book3d.querySelectorAll('.page-leaf');
        leaves.forEach((leaf, idx) => {
          if (idx < currentLeafIdx) {
            leaf.classList.add('flipped');
            leaf.style.zIndex = idx + 1;
          } else {
            leaf.classList.remove('flipped');
            leaf.style.zIndex = totalLeaves - idx;
          }
        });
      }

      nextBtn.addEventListener('click', () => {
        if (currentLeafIdx < totalLeaves - 1) {
          currentLeafIdx++;
          updatePageFlips();
        }
      });

      prevBtn.addEventListener('click', () => {
        if (currentLeafIdx > 0) {
          currentLeafIdx--;
          updatePageFlips();
        }
      });

      backBtn.addEventListener('click', () => {
        viewerView.classList.add('hidden');
        viewerDock.classList.add('hidden');
        backBtn.classList.add('hidden');
        shelfView.classList.remove('hidden');
      });

      // Carousel Dots
      dots.forEach((dot, idx) => {
        dot.addEventListener('click', () => {
          dots.forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
          shelfCarousel.style.transform = `translateX(-${idx * 270}px)`;
        });
      });

      // Keyboard Controls
      document.addEventListener('keydown', (e) => {
        if (!viewerView.classList.contains('hidden')) {
          if (e.key === 'ArrowRight') nextBtn.click();
          if (e.key === 'ArrowLeft') prevBtn.click();
          if (e.key === 'Escape') backBtn.click();
        }
      });

      // Lightbox Modal
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      const closeModal = document.querySelector('.close-modal');

      function bindModals() {
        document.querySelectorAll('.page-slot img').forEach(img => {
          img.addEventListener('click', (e) => {
            e.stopPropagation();
            modal.style.display = 'flex';
            modalImg.src = img.src;
          });
        });
      }

      closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
      modal.addEventListener('click', () => { modal.style.display = 'none'; });

    });
  </script>
</body>
</html>
