<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchbook</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #12141c;
      color: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Top Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      background: transparent;
      z-index: 100;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .icon-btn.hidden {
      display: none;
    }

    /* VIEW 1: Carousel Shelf */
    .shelf-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1500px;
    }

    .shelf-view.hidden {
      display: none;
    }

    .shelf-container {
      display: flex;
      gap: 3rem;
      align-items: center;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .sketchbook-cover {
      width: 240px;
      height: 340px;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      border-left: 10px solid rgba(0, 0, 0, 0.3);
      transition: transform 0.4s ease, filter 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sketchbook-cover:hover {
      transform: translateY(-10px) scale(1.03);
      filter: brightness(1.15);
    }

    .cover-dark { background: #1a1c23; }
    .cover-warm { background: #25201e; }
    .cover-blue { background: #192231; }

    .shelf-dots {
      display: flex;
      gap: 0.6rem;
      margin-top: 2rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .dot.active {
      background: #ffffff;
    }

    /* VIEW 2: Open Notebook Viewer */
    .viewer-view {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 3500px;
    }

    .viewer-view.hidden {
      display: none;
    }

    .book-stage {
      width: 840px;
      height: 570px;
      position: relative;
      background: #faf9f6;
      border-radius: 4px;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.65);
      display: flex;
      transform-style: preserve-3d;
    }

    .page-left, .page-right {
      width: 50%;
      height: 100%;
      position: absolute;
      top: 0;
      background: #faf9f6;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page-left {
      left: 0;
      border-radius: 4px 0 0 4px;
      border-right: 1px solid #e2dfdb;
      box-shadow: inset -18px 0 30px rgba(0, 0, 0, 0.04);
    }

    .page-right {
      right: 0;
      border-radius: 0 4px 4px 0;
      box-shadow: inset 18px 0 30px rgba(0, 0, 0, 0.04);
    }

    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 50px;
      height: 100%;
      transform: translateX(-50%);
      background: linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0.01) 50%, rgba(0,0,0,0.08));
      pointer-events: none;
      z-index: 5;
    }

    .flipping-sheet {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
      z-index: 10;
      pointer-events: none;
    }

    .sheet-front, .sheet-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background: #faf9f6;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .sheet-back {
      transform: rotateY(180deg);
      background: #f4f3ef;
    }

    .paper-shadow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.15), transparent 30%);
      opacity: 0;
      transition: opacity 0.45s ease-in-out;
      pointer-events: none;
      z-index: 6;
    }

    .page-slot {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .page-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-dock {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding: 1.2rem;
      background: transparent;
      z-index: 100;
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 10, 15, 0.96);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay img {
      max-width: 92%;
      max-height: 92%;
      object-fit: contain;
    }

    .close-modal {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 36px;
      color: #a0aec0;
      cursor: pointer;
    }

    .close-modal:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="icon-btn hidden" id="back-btn" title="Back to Shelf">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </header>

  <section id="shelf-view" class="shelf-view">
    <div class="shelf-container" id="shelf-carousel">
      <div class="sketchbook-cover cover-dark" data-book="0"></div>
      <div class="sketchbook-cover cover-warm" data-book="1"></div>
      <div class="sketchbook-cover cover-blue" data-book="2"></div>
    </div>
    
    <div class="shelf-dots" id="shelf-dots">
      <div class="dot active" data-index="0"></div>
      <div class="dot" data-index="1"></div>
      <div class="dot" data-index="2"></div>
    </div>
  </section>

  <main id="viewer-view" class="viewer-view hidden">
    <div class="book-stage" id="book-stage">
      <div class="page-left" id="page-left"></div>
      <div class="book-spine"></div>
      <div class="page-right" id="page-right"></div>
      <div class="flipping-sheet" id="flipping-sheet">
        <div class="sheet-front" id="sheet-front"></div>
        <div class="sheet-back" id="sheet-back"></div>
        <div class="paper-shadow" id="paper-shadow"></div>
      </div>
    </div>
  </main>

  <nav class="app-dock hidden" id="viewer-dock">
    <button class="dock-btn" id="prev-btn" title="Previous Page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="dock-btn" id="next-btn" title="Next Page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

  <div id="image-modal" class="modal-overlay">
    <span class="close-modal">&times;</span>
    <img id="modal-img" src="" alt="Enlarged Art">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const sketchbooks = [
        {
          pages: [
            "https://via.placeholder.com/600x850/e2e8f0/12141c?text=Book+1+-+Page+1",
            "https://via.placeholder.com/600x850/cbd5e1/12141c?text=Book+1+-+Page+2",
            "https://via.placeholder.com/600x850/94a3b8/12141c?text=Book+1+-+Page+3",
            "https://via.placeholder.com/600x850/64748b/12141c?text=Book+1+-+Page+4"
          ]
        },
        {
          pages: [
            "https://via.placeholder.com/600x850/f1f5f9/12141c?text=Book+2+-+Page+1",
            "https://via.placeholder.com/600x850/e2e8f0/12141c?text=Book+2+-+Page+2",
            "https://via.placeholder.com/600x850/cbd5e1/12141c?text=Book+2+-+Page+3"
          ]
        },
        {
          pages: [
            "https://via.placeholder.com/600x850/cbd5e1/12141c?text=Book+3+-+Page+1",
            "https://via.placeholder.com/600x850/94a3b8/12141c?text=Book+3+-+Page+2"
          ]
        }
      ];

      let currentBook = null;
      let currentSpread = 0;
      let totalSpreads = 0;
      let isAnimating = false;

      const shelfView = document.getElementById('shelf-view');
      const viewerView = document.getElementById('viewer-view');
      const viewerDock = document.getElementById('viewer-dock');
      const backBtn = document.getElementById('back-btn');
      const shelfCarousel = document.getElementById('shelf-carousel');
      const dots = document.querySelectorAll('.dot');
      
      const pageLeft = document.getElementById('page-left');
      const pageRight = document.getElementById('page-right');
      const sheetFront = document.getElementById('sheet-front');
      const sheetBack = document.getElementById('sheet-back');
      const flippingSheet = document.getElementById('flipping-sheet');
      const paperShadow = document.getElementById('paper-shadow');
      const nextBtn = document.getElementById('next-btn');
      const prevBtn = document.getElementById('prev-btn');

      document.querySelectorAll('.sketchbook-cover').forEach(card => {
        card.addEventListener('click', () => {
          const bookIdx = parseInt(card.getAttribute('data-book'));
          currentBook = sketchbooks[bookIdx];
          
          if (currentBook.pages.length % 2 !== 0) {
            currentBook.pages.push("");
          }

          totalSpreads = currentBook.pages.length / 2;
          currentSpread = 0;

          updateSpreadDisplay();

          shelfView.classList.add('hidden');
          viewerView.classList.remove('hidden');
          viewerDock.classList.remove('hidden');
          backBtn.classList.remove('hidden');
        });
      });

      function getContentHTML(src) {
        if (!src) return '';
        return `<div class="page-slot"><img src="${src}" alt="Drawing"></div>`;
      }

      function updateSpreadDisplay() {
        const leftIdx = currentSpread * 2;
        const rightIdx = currentSpread * 2 + 1;

        pageLeft.innerHTML = getContentHTML(currentBook.pages[leftIdx]);
        pageRight.innerHTML = getContentHTML(currentBook.pages[rightIdx]);
        flippingSheet.style.transition = 'none';
        flippingSheet.style.transform = 'rotateY(0deg)';
        paperShadow.style.opacity = '0';
        bindModals();
      }

      nextBtn.addEventListener('click', () => {
        if (isAnimating || currentSpread >= totalSpreads - 1) return;
        isAnimating = true;

        const oldRightIdx = currentSpread * 2 + 1;
        const nextLeftIdx = (currentSpread + 1) * 2;
        const nextRightIdx = (currentSpread + 1) * 2 + 1;

        sheetFront.innerHTML = getContentHTML(currentBook.pages[oldRightIdx]);
        sheetBack.innerHTML = getContentHTML(currentBook.pages[nextLeftIdx]);

        pageLeft.innerHTML = getContentHTML(currentBook.pages[nextLeftIdx]);
        pageRight.innerHTML = getContentHTML(currentBook.pages[nextRightIdx]);

        flippingSheet.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1)';
        
        paperShadow.style.transition = 'opacity 0.45s ease-in-out';
        paperShadow.style.opacity = '1';
        setTimeout(() => {
          paperShadow.style.opacity = '0';
        }, 450);

        flippingSheet.style.transform = 'rotateY(-180deg)';

        setTimeout(() => {
          currentSpread++;
          flippingSheet.style.transition = 'none';
          flippingSheet.style.transform = 'rotateY(0deg)';
          sheetFront.innerHTML = '';
          sheetBack.innerHTML = '';
          isAnimating = false;
          bindModals();
        }, 900);
      });

      prevBtn.addEventListener('click', () => {
        if (isAnimating || currentSpread <= 0) return;
        isAnimating = true;

        const currentLeftIdx = currentSpread * 2;
        const prevRightIdx = (currentSpread - 1) * 2 + 1;
        const prevLeftIdx = (currentSpread - 1) * 2;

        sheetFront.innerHTML = getContentHTML(currentBook.pages[prevRightIdx]);
        sheetBack.innerHTML = getContentHTML(currentBook.pages[currentLeftIdx]);

        flippingSheet.style.transition = 'none';
        flippingSheet.style.transform = 'rotateY(-180deg)';

        pageLeft.innerHTML = getContentHTML(currentBook.pages[prevLeftIdx]);
        pageRight.innerHTML = getContentHTML(currentBook.pages[prevRightIdx]);

        paperShadow.style.transition = 'opacity 0.45s ease-in-out';
        paperShadow.style.opacity = '1';
        setTimeout(() => {
          paperShadow.style.opacity = '0';
        }, 450);

        setTimeout(() => {
          flippingSheet.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1)';
          flippingSheet.style.transform = 'rotateY(0deg)';
        }, 50);

        setTimeout(() => {
          currentSpread--;
          sheetFront.innerHTML = '';
          sheetBack.innerHTML = '';
          isAnimating = false;
          bindModals();
        }, 950);
      });

      backBtn.addEventListener('click', () => {
        viewerView.classList.add('hidden');
        viewerDock.classList.add('hidden');
        backBtn.classList.add('hidden');
        shelfView.classList.remove('hidden');
      });

      dots.forEach((dot, idx) => {
        dot.addEventListener('click', () => {
          dots.forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
          shelfCarousel.style.transform = `translateX(-${idx * 270}px)`;
        });
      });

      document.addEventListener('keydown', (e) => {
        if (!viewerView.classList.contains('hidden')) {
          if (e.key === 'ArrowRight') nextBtn.click();
          if (e.key === 'ArrowLeft') prevBtn.click();
          if (e.key === 'Escape') backBtn.click();
        }
      });

      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      const closeModal = document.querySelector('.close-modal');

      function bindModals() {
        document.querySelectorAll('.page-slot img').forEach(img => {
          img.addEventListener('click', (e) => {
            e.stopPropagation();
            modal.style.display = 'flex';
            modalImg.src = img.src;
          });
        });
      }

      closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
      modal.addEventListener('click', () => { modal.style.display = 'none'; });

    });
  </script>
</body>
</html>
