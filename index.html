<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchbook - Paper App Style</title>

  <!-- Minimalist Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #12141c; /* Paper app dark navy background */
      color: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Top App Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2.5rem;
      background: transparent;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .icon-btn.hidden {
      display: none;
    }

    .header-title-box {
      text-align: center;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .header-title-box h1 {
      font-size: 1.15rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.03em;
    }

    .header-title-box span {
      font-size: 0.72rem;
      color: #8c9cb8;
      letter-spacing: 0.05em;
    }

    /* VIEW 1: COVER SHELF / CAROUSEL (Matching Video 00:00) */
    .shelf-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1500px;
      overflow: hidden;
    }

    .shelf-view.hidden {
      display: none;
    }

    .shelf-container {
      display: flex;
      gap: 3rem;
      align-items: center;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      padding: 2rem;
    }

    .sketchbook-cover-card {
      width: 250px;
      height: 350px;
      background: #1e222d;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      border-left: 10px solid rgba(0, 0, 0, 0.3); /* Spine shadow */
      transition: transform 0.4s ease, filter 0.4s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sketchbook-cover-card:hover {
      transform: translateY(-10px) scale(1.03);
      filter: brightness(1.15);
    }

    .cover-icon {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .cover-title-text {
      font-size: 1.25rem;
      font-weight: 500;
      color: #ffffff;
    }

    /* Carousel Pagination Dots (Matching Video 00:00) */
    .shelf-dots {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .dot.active {
      background: #ffffff;
    }

    /* VIEW 2: OPEN JOURNAL 3D SPREAD VIEWER (Matching Video 00:01+) */
    .viewer-view {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 2500px;
      position: relative;
    }

    .viewer-view.hidden {
      display: none;
    }

    .book-stage {
      width: 880px;
      height: 540px;
      position: relative;
      transform-style: preserve-3d;
    }

    .book-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    /* 3D Page Leaf (Double-page spread simulation) */
    .page-leaf {
      position: absolute;
      width: 100%;
      height: 100%;
      right: 0;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    .page-leaf.flipped {
      transform: rotateY(-180deg);
    }

    .page-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background-color: #faf9f6; /* Clean paper white */
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      overflow: hidden;
    }

    .page-side.back {
      transform: rotateY(180deg);
      background-color: #f2f0eb;
    }

    /* Spread Image Slot (Fills the entire open journal spread seamlessly) */
    .spread-slot {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .spread-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Bottom Navigation Dock */
    .app-dock {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
      background: transparent;
      z-index: 100;
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    /* Fullscreen Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 10, 15, 0.96);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay img {
      max-width: 92%;
      max-height: 92%;
      object-fit: contain;
    }

    .close-modal {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 36px;
      color: #a0aec0;
      cursor: pointer;
    }

    .close-modal:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn hidden" id="back-btn" title="Back to Shelf">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
    </div>
    <div class="header-title-box">
      <h1 id="header-title">sketchbook</h1>
      <span id="page-counter">3 Spreads</span>
    </div>
  </header>

  <!-- VIEW 1: Shelf Carousel (Matching Video 00:00) -->
  <section id="shelf-view" class="shelf-view">
    <div class="shelf-container" id="shelf-carousel">
      
      <!-- Sketchbook 1 -->
      <div class="sketchbook-cover-card" data-book="0" style="background: #1a1c23;">
        <div class="cover-icon">⚡</div>
        <div class="cover-title-text">Journal</div>
      </div>

      <!-- Sketchbook 2 -->
      <div class="sketchbook-cover-card" data-book="1" style="background: #2b2523;">
        <div class="cover-icon">🎨</div>
        <div class="cover-title-text">Portraits & Studies</div>
      </div>

      <!-- Sketchbook 3 -->
      <div class="sketchbook-cover-card" data-book="2" style="background: #1e2638;">
        <div class="cover-icon">✨</div>
        <div class="cover-title-text">Illustrations</div>
      </div>

    </div>

    <!-- Pagination Dots -->
    <div class="shelf-dots" id="shelf-dots">
      <div class="dot active" data-index="0"></div>
      <div class="dot" data-index="1"></div>
      <div class="dot" data-index="2"></div>
    </div>
  </section>

  <!-- VIEW 2: Open Journal Spread Viewer (Matching Video 00:01+) -->
  <main id="viewer-view" class="viewer-view hidden">
    <div class="book-stage">
      <div class="book-3d" id="book-3d">
        
        <!-- 
          ⭐ ADD ANY AMOUNT OF SPREADS/PAGES YOU WANT BELOW! ⭐
          Each element represents an open journal spread image (like the artwork spreads in the video).
        --><div class="spread-item"><img src="images/my-drawing-3.jpg" alt="Spread 3"></div>
        <div class="spread-item"><img src="https://via.placeholder.com/1200x800/e2e8f0/12141c?text=Spread+1:+Lovers+Art" alt="Spread 1"></div>
        <div class="spread-item"><img src="https://via.placeholder.com/1200x800/cbd5e1/12141c?text=Spread+2:+Fish+and+Hand+Sketch" alt="Spread 2"></div>
        <div class="spread-item"><img src="https://via.placeholder.com/1200x800/94a3b8/12141c?text=Spread+3:+Galloping+Horses" alt="Spread 3"></div>
        <!-- To add more, simply duplicate the line below: -->
        <!-- <div class="spread-item"><img src="your-image-url.jpg" alt="Spread 4"></div> -->

      </div>
    </div>
  </main>

  <!-- Bottom Navigation Dock -->
  <nav class="app-dock hidden" id="viewer-dock">
    <button class="dock-btn" id="prev-btn" title="Previous Spread">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="dock-btn" id="next-btn" title="Next Spread">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

  <!-- Fullscreen Modal Viewer -->
  <div id="image-modal" class="modal-overlay">
    <span class="close-modal">&times;</span>
    <img id="modal-img" src="" alt="Enlarged Spread">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const booksMetadata = [
        { title: "Journal" },
        { title: "Portraits & Studies" },
        { title: "Illustrations" }
      ];

      let currentLeafIdx = 0;
      let totalLeaves = 0;

      const shelfView = document.getElementById('shelf-view');
      const viewerView = document.getElementById('viewer-view');
      const viewerDock = document.getElementById('viewer-dock');
      const backBtn = document.getElementById('back-btn');
      const headerTitle = document.getElementById('header-title');
      const pageCounter = document.getElementById('page-counter');
      const book3d = document.getElementById('book-3d');
      const nextBtn = document.getElementById('next-btn');
      const prevBtn = document.getElementById('prev-btn');
      const shelfCarousel = document.getElementById('shelf-carousel');
      const dots = document.querySelectorAll('.dot');

      // 1. Open Book from Shelf Carousel
      document.querySelectorAll('.sketchbook-cover-card').forEach(card => {
        card.addEventListener('click', () => {
          const bookIdx = parseInt(card.getAttribute('data-book'));
          headerTitle.textContent = booksMetadata[bookIdx].title;

          buildJournalSpreads();

          shelfView.classList.add('hidden');
          viewerView.classList.remove('hidden');
          viewerDock.classList.remove('hidden');
          backBtn.classList.remove('hidden');
        });
      });

      // 2. Build 3D Pages from HTML items
      function buildJournalSpreads() {
        const rawSpreads = Array.from(book3d.querySelectorAll('.spread-item'));
        book3d.innerHTML = '';

        totalLeaves = rawSpreads.length;
        pageCounter.textContent = `${totalLeaves} Spreads`;

        for (let i = 0; i < totalLeaves; i++) {
          const leaf = document.createElement('div');
          leaf.className = 'page-leaf';
          leaf.style.zIndex = totalLeaves - i;

          const content = rawSpreads[i] ? rawSpreads[i].innerHTML : '';

          leaf.innerHTML = `
            <div class="page-side front">
              ${content ? `<div class="spread-slot">${content}</div>` : ''}
            </div>
            <div class="page-side back">
              <div class="spread-slot" style="background: #e6e4df;"></div>
            </div>
          `;

          book3d.appendChild(leaf);
        }

        currentLeafIdx = 0;
        updatePageFlips();
        bindModals();
      }

      function updatePageFlips() {
        const leaves = book3d.querySelectorAll('.page-leaf');
        leaves.forEach((leaf, idx) => {
          if (idx < currentLeafIdx) {
            leaf.classList.add('flipped');
            leaf.style.zIndex = idx + 1;
          } else {
            leaf.classList.remove('flipped');
            leaf.style.zIndex = totalLeaves - idx;
          }
        });
      }

      // Navigation
      nextBtn.addEventListener('click', () => {
        if (currentLeafIdx < totalLeaves) {
          currentLeafIdx++;
          updatePageFlips();
        }
      });

      prevBtn.addEventListener('click', () => {
        if (currentLeafIdx > 0) {
          currentLeafIdx--;
          updatePageFlips();
        }
      });

      // Back to Shelf
      backBtn.addEventListener('click', () => {
        viewerView.classList.add('hidden');
        viewerDock.classList.add('hidden');
        backBtn.classList.add('hidden');
        shelfView.classList.remove('hidden');
        headerTitle.textContent = "sketchbook";
        pageCounter.textContent = "3 Spreads";
      });

      // Shelf Dots Interaction
      dots.forEach((dot, idx) => {
        dot.addEventListener('click', () => {
          dots.forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
          shelfCarousel.style.transform = `translateX(-${idx * 280}px)`;
        });
      });

      // Keyboard Controls
      document.addEventListener('keydown', (e) => {
        if (!viewerView.classList.contains('hidden')) {
          if (e.key === 'ArrowRight') nextBtn.click();
          if (e.key === 'ArrowLeft') prevBtn.click();
          if (e.key === 'Escape') backBtn.click();
        }
      });

      // Lightbox Modal
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      const closeModal = document.querySelector('.close-modal');

      function bindModals() {
        document.querySelectorAll('.spread-slot img').forEach(img => {
          img.addEventListener('click', (e) => {
            e.stopPropagation();
            modal.style.display = 'flex';
            modalImg.src = img.src;
          });
        });
      }

      closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
      modal.addEventListener('click', () => { modal.style.display = 'none'; });

    });
  </script>
</body>
</html>
